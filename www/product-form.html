<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SIWRAD Vision - Tambah Produk</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/productForm.css">

</head>

<body>

<div class="form-page">

<h1>📦 Tambah Produk</h1>

<p>Lengkapi data produk sebelum pengambilan foto.</p>

<br>

<input
id="productName"
type="text"
placeholder="Nama Produk">

<br><br>

<input
id="productCategory"
type="text"
placeholder="Kategori">

<br><br>

<input
id="productPrice"
type="number"
placeholder="Harga (Rp)">

<br><br>

<input
id="productBarcode"
type="text"
placeholder="Barcode (Opsional)">

<br><br>

<button id="btnStartCamera">

📷 Lanjut Ambil Foto

</button>

<br><br>

<button id="btnBack">

🏠 Kembali ke Dashboard

</button>

</div>

<script src="js/productFormEngine.js"></script>

</body>
</html>
